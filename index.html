<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENEM Natureza</title>
<meta name="description" content="Banco de questões de Ciências da Natureza do ENEM para estudar offline.">
<meta name="theme-color" content="#101828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ENEM Natureza">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  /* Layout: barra fixa no topo (marca, abas das matérias, busca, sortear) + uma coluna central de leitura;
     cada matéria tinge seu cabeçalho com a própria cor; a questão abre em modo prova, com barra de ação embaixo. */
  :root {
    --bg: #eef1f5; --surface: #ffffff; --sunk: #f5f7fa; --ink: #101828; --muted: #5b6475; --line: #dde2ea; --line-strong: #c3cad6;
    --primary: #101828; --on-primary: #ffffff; --focus: #3b6ef5;
    --bio: #15803d; --fis: #1d4ed8; --qui: #c2410c;
    --good: #15803d; --good-soft: #e6f4ea; --bad: #c62828; --bad-soft: #fcebea; --gold: #b7791f;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 6px 18px rgba(16, 24, 40, .06);
    --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-text: "Source Serif 4", Georgia, "Times New Roman", serif;
    --f-code: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --r: 14px; --r-sm: 9px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0b0e13; --surface: #141921; --sunk: #10141b; --ink: #e8ecf2; --muted: #98a2b3; --line: #242b37; --line-strong: #364153;
    --primary: #e8ecf2; --on-primary: #0b0e13; --focus: #7fa3ff;
    --bio: #4ade80; --fis: #7ea3ff; --qui: #fb923c;
    --good: #4ade80; --good-soft: #0f2a1b; --bad: #ff7b72; --bad-soft: #391614; --gold: #f2c14e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #0b0e13; --surface: #141921; --sunk: #10141b; --ink: #e8ecf2; --muted: #98a2b3; --line: #242b37; --line-strong: #364153;
    --primary: #e8ecf2; --on-primary: #0b0e13; --focus: #7fa3ff;
    --bio: #4ade80; --fis: #7ea3ff; --qui: #fb923c;
    --good: #4ade80; --good-soft: #0f2a1b; --bad: #ff7b72; --bad-soft: #391614; --gold: #f2c14e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .inner { max-width: 1120px; margin: 0 auto; }

  /* barra do topo */
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .appbar { position: sticky; top: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .net { font-size: .74rem; font-weight: 600; border-radius: 999px; padding: 3px 9px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; background: var(--sunk); }
  .net.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
  .net.load { color: var(--focus); }
  @media (max-width: 420px) { #sortear-topo span { display: none; } .net { display: none; } }

  /* rascunho à mão */
  .paper { position: relative; }
  canvas.tinta { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; touch-action: auto; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .folha { position: relative; border-radius: var(--r); border: 1px solid var(--line); background-color: var(--surface);
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 24px 24px; overflow: hidden; }
  .folha .rot { position: absolute; top: 8px; left: 12px; font-size: .78rem; color: var(--muted); font-weight: 600; pointer-events: none; z-index: 1; }
  .folha canvas.tinta { position: absolute; }
  /* quadro de rascunho em tela cheia */
  html.quadro-aberto, html.quadro-aberto body { overflow: hidden; overscroll-behavior: none; }
  .quadro { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; touch-action: none; -webkit-user-select: none; user-select: none; }
  .quadro-barra { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 8px) max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
  .quadro-fer { display: flex; gap: 6px; align-items: center; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; touch-action: pan-x; }
  .quadro-fer::-webkit-scrollbar { display: none; }
  .quadro-fer .sep { width: 1px; align-self: stretch; background: var(--line); flex: none; }
  .fer.txt { width: auto; padding: 0 10px; font-size: .78rem; font-weight: 700; }
  .fer .borr { width: 16px; height: 12px; border-radius: 3px; border: 2px solid var(--muted); display: block; transform: rotate(-20deg); }
  .fer[disabled] { opacity: .35; }
  .quadro-dica { font-size: .74rem; color: var(--muted); text-align: center; padding: 4px 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .quadro-vp { flex: 1; position: relative; overflow: hidden; touch-action: none; }
  .quadro-palco { position: absolute; left: 0; top: 0; width: 100%; padding: 12px max(10px, env(safe-area-inset-left, 0px)) 40px; transform-origin: 0 0; display: flex; flex-direction: column; gap: 14px; will-change: transform; }
  .quadro-palco .paper { max-width: 820px; width: 100%; margin: 0 auto; }
  .quadro-palco .folha { max-width: 820px; width: 100%; margin: 0 auto; }
  .quadro-palco .alt, .quadro-palco button { pointer-events: none; }
  .ferramentas { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding-block: 8px 0; scrollbar-width: none; max-width: 820px; margin: 0 auto; }
  .ferramentas::-webkit-scrollbar { display: none; }
  .ferramentas .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; flex: none; }
  .fer { flex: none; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
  .fer[aria-pressed="true"] { border-color: var(--focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 30%, transparent); }
  .fer .cor { width: 18px; height: 18px; border-radius: 50%; display: block; }
  .fer .mt { width: 20px; height: 10px; border-radius: 3px; display: block; opacity: .6; }
  .lapis[aria-pressed="true"] { background: var(--focus); color: #fff; border-color: var(--focus); }
  @media (max-width: 480px) { .mark .lbl { display: none; } .mark { padding: 8px; } }
  .arquivo { position: relative; overflow: hidden; }
  .arquivo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .appbar .inner { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; font-weight: 700; font-size: 1.02rem; letter-spacing: -.01em; white-space: nowrap; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--primary); display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 7px 6px; }
  .logo i { border-radius: 2px; }
  .tabs { display: flex; gap: 4px; margin-left: 6px; }
  .tab { border: 0; background: none; padding: 7px 12px; border-radius: 999px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .tab:hover { color: var(--ink); background: var(--sunk); }
  .tab[aria-current="page"] { color: var(--ink); background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
  .tab .dot { width: 8px; height: 8px; }
  .search { margin-left: auto; position: relative; flex: 0 1 260px; min-width: 0; }
  .search input { width: 100%; border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 8px 14px 8px 36px; }
  .search input:focus { outline: none; border-color: var(--focus); background: var(--surface); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 16px; height: 16px; }
  .appbar .subnav { display: none; }
  @media (max-width: 1180px) {
    .tabs { display: none; }
    .appbar .subnav { display: flex; gap: 6px; overflow-x: auto; padding-top: 0; padding-bottom: 10px; scrollbar-width: none; }
    .subnav::-webkit-scrollbar { display: none; }
    .search { flex: 1 1 auto; }
    .brand .txt { display: none; }
  }

  /* botões e chips */
  .btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 9px 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .btn.primary:hover { opacity: .9; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--sunk); }
  .btn.sm { padding: 6px 12px; font-size: .88rem; }
  .btn.icon { padding: 8px; }
  .btn[disabled] { opacity: .4; cursor: default; pointer-events: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: .76rem; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .chip.facil { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, var(--line)); background: var(--good-soft); }
  .chip.dificil { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); background: var(--bad-soft); }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; background: var(--mc, var(--muted)); }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .86rem; font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

  /* estrutura */
  main.inner { padding-block: 22px 200px; display: flex; flex-direction: column; gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
  .pad { padding: 20px 22px; }
  @media (max-width: 560px) { .pad { padding: 16px; } }
  h1, h2, h3 { margin: 0; letter-spacing: -.015em; text-wrap: balance; }
  h1 { font-size: 1.7rem; font-weight: 700; }
  h2 { font-size: 1.2rem; font-weight: 700; }
  h3 { font-size: 1rem; font-weight: 600; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .sm { font-size: .87rem; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .88rem; color: var(--muted); }
  .crumbs button { border: 0; background: none; padding: 0; color: var(--muted); font-weight: 500; }
  .crumbs button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .num { font-family: var(--f-code); font-variant-numeric: tabular-nums; }

  /* progresso */
  .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .bar .ok { background: var(--good); } .bar .ko { background: var(--bad); }
  .mix { height: 6px; border-radius: 99px; overflow: hidden; display: flex; gap: 2px; }
  .mix i { display: block; height: 100%; border-radius: 2px; }
  .ring { --p: 0; --q: 0; width: 132px; height: 132px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: conic-gradient(var(--good) calc(var(--p) * 1%), var(--bad) 0 calc((var(--p) + var(--q)) * 1%), var(--line) 0); }
  .ring > div { width: 104px; height: 104px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; line-height: 1.15; }
  .ring b { font-size: 1.6rem; font-family: var(--f-code); }

  /* início */
  .hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
  @media (max-width: 620px) { .hero { grid-template-columns: minmax(0, 1fr); justify-items: start; } }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .stat { background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; }
  .stat b { display: block; font-size: 1.35rem; font-family: var(--f-code); line-height: 1.2; }
  .stat button { border: 0; background: none; padding: 0; text-align: left; width: 100%; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .mcard { overflow: hidden; display: flex; flex-direction: column; }
  .mcard .band { background: color-mix(in srgb, var(--mc) 13%, var(--surface)); border-bottom: 1px solid color-mix(in srgb, var(--mc) 25%, var(--line)); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .mcard .band h2 { display: flex; align-items: center; gap: 10px; }
  .mcard .band .num { font-size: 1.5rem; font-weight: 500; }
  .mcard .body { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .toplist { display: flex; flex-direction: column; }
  .toplist button { display: grid; grid-template-columns: 10px minmax(0, 1fr) 110px auto; gap: 12px; align-items: center; border: 0; background: none; padding: 9px 4px; text-align: left; border-top: 1px solid var(--line); }
  .toplist button:first-child { border-top: 0; }
  .toplist button:hover { background: var(--sunk); }
  @media (max-width: 520px) { .toplist button { grid-template-columns: 10px minmax(0, 1fr) auto; } .toplist .bar { display: none; } }

  /* cabeçalho de matéria/tópico */
  .head { overflow: hidden; }
  .head .band { background: color-mix(in srgb, var(--mc, var(--muted)) 11%, var(--surface)); padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .head .band h1 { display: flex; align-items: center; gap: 12px; }
  .head .band .dot { width: 14px; height: 14px; border-radius: 4px; }
  .head .meta { padding: 14px 22px; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
  .head .meta .kv b { font-family: var(--f-code); font-size: 1.05rem; margin-right: 4px; }
  @media (max-width: 560px) { .head .band, .head .meta { padding-left: 16px; padding-right: 16px; } }

  /* cartões de tópico */
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .tcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; box-shadow: var(--shadow); }
  .tcard:hover { border-color: var(--mc, var(--line-strong)); }
  .tcard .desc { color: var(--muted); font-size: .84rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
  .tcard .foot { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }
  .tcard.inter { background: var(--sunk); border-style: dashed; }

  /* filtros */
  .filters { display: flex; flex-direction: column; gap: 12px; }
  .filters .grp { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .filters .lab { font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; width: 92px; }
  .badge { background: var(--focus); color: #fff; border-radius: 999px; font-size: .72rem; padding: 0 7px; font-weight: 700; }

  /* lista de questões */
  .qlist { list-style: none; margin: 0; padding: 0; }
  .qlist li + li { border-top: 1px solid var(--line); }
  .qrow { width: 100%; display: grid; grid-template-columns: 28px 86px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border: 0; background: none; padding: 12px 18px; }
  .qrow:hover { background: var(--sunk); }
  .qrow .code { font-family: var(--f-code); font-size: .8rem; color: var(--muted); }
  .qrow .sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .qrow .sub small { display: block; color: var(--muted); font-size: .78rem; }
  .qrow .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 620px) { .qrow { grid-template-columns: 26px minmax(0, 1fr); padding: 12px 14px; } .qrow .code { grid-column: 2; order: -1; } .qrow .chips { grid-column: 2; justify-content: flex-start; } }
  .st { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-strong); color: var(--muted); }
  .st svg { width: 14px; height: 14px; stroke-width: 3; }
  .st.ok { background: var(--good); border-color: var(--good); color: var(--surface); }
  .st.ko { background: var(--bad); border-color: var(--bad); color: var(--surface); }
  .empty { padding: 36px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }

  /* questão */
  .qwrap { max-width: 820px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .qtop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
  .timer { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-code); font-size: .9rem; color: var(--muted); padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .paper { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .paper .phead { padding: 14px 22px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: color-mix(in srgb, var(--mc, var(--muted)) 8%, var(--surface)); }
  .paper .phead .qn { font-family: var(--f-code); font-weight: 500; }
  .paper .pbody { padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 16px; }
  @media (max-width: 560px) { .paper .phead { padding: 12px 16px; } .paper .pbody { padding: 18px 16px 20px; } }
  .note { font-size: .86rem; padding: 9px 12px; border-radius: var(--r-sm); background: var(--sunk); border: 1px dashed var(--line-strong); color: var(--muted); }
  .qtext { font-family: var(--f-text); font-size: 1.08rem; line-height: 1.7; overflow-wrap: anywhere; }
  .qtext p { margin: 0 0 .85em; }
  .qtext img { display: block; max-width: 100%; height: auto; margin: 12px auto; border-radius: 6px; background: #fff; padding: 4px; }
  .qtext table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; font-family: var(--f-ui); font-size: .92rem; }
  .qtext td, .qtext th { border: 1px solid var(--line); padding: 4px 8px; }
  .qtext a { color: var(--focus); }
  .qtext strong { font-weight: 600; }
  .intro { font-family: var(--f-text); font-weight: 600; font-size: 1.08rem; line-height: 1.6; }
  .alts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .alt { display: grid; grid-template-columns: 36px minmax(0, 1fr) 34px; align-items: start; gap: 12px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 10px 8px 10px 12px; }
  .alt .pick { display: contents; }
  .alt .l { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-weight: 700; font-size: .92rem; background: var(--surface); border-style: solid; padding: 0; }

<script>

  function passa(q) {

        ptrs.delete(ev.pointerId);
        if (desenho && desenho.id === ev.pointerId) {
          if (desenho.apagados) { if (desenho.apagados.length) registra({ tipo: 'apaga', tela: desenho.tela, tracos: desenho.apagados }); }
          else { const tr = desenho.traco; tr.p = tr.p.map((q) => [+q[0].toFixed(5), +q[1].toFixed(5), +q[2].toFixed(2)]); registra({ tipo: 'add', tela: desenho.tela, tracos: [tr] }); }
          desenho = null;
        }
        if (gesto && gesto.ids.includes(ev.pointerId)) {
          const s0 = gesto.s0;
          const resto = [...ptrs.values()].filter((p) => p.tipo !== 'pen').length;
          if (resto) iniciaGesto(); else { gesto = null; if (st.s !== s0) redesenhaDepois(); }
        }
      };
      vp.addEventListener('pointerup', fim); vp.addEventListener('pointercancel', fim);
      vp.addEventListener('wheel', (ev) => {                          // mouse e trackpad no computador
        ev.preventDefault();
        const [x, y] = rel(ev.clientX, ev.clientY);
        if (ev.ctrlKey || ev.metaKey) { zoomEm(x, y, st.s * Math.exp(-ev.deltaY * 0.01)); redesenhaDepois(); }
        else { st.tx -= ev.deltaX; st.ty -= ev.deltaY; aplicaT(); }
      }, { passive: false });
      // impede o zoom do próprio Safari enquanto o quadro está aberto
      ['gesturestart', 'gesturechange'].forEach((n) => document.addEventListener(n, (e) => { if (st.aberto) e.preventDefault(); }, { passive: false }));
      document.addEventListener('keydown', (e) => { if (st.aberto && e.key === 'Escape') fecha(); });
    }

    // ----- quadro em tela cheia -----
    function monta() {
      const fer = (rotulo, conteudo, onclick) => el('button', { class: 'fer', type: 'button', title: rotulo, 'aria-label': rotulo, onclick }, conteudo);
      bt.cores = CORES.map(([n, c], i) => fer('Caneta ' + n.toLowerCase(), el('span', { class: 'cor', style: `background:${c}` }), () => { st.modo = 'caneta'; st.cor = i; atualizaBotoes(); }));
      bt.marca = fer('Marca-texto', el('span', { class: 'mt', style: 'background:#f5c518' }), () => { st.modo = 'marca'; atualizaBotoes(); });
      bt.borracha = fer('Borracha', el('span', { class: 'borr' }), () => { st.modo = 'borracha'; atualizaBotoes(); });
      bt.desfazer = fer('Desfazer', ic('back'), () => { const op = st.desfazer.pop(); if (op) { aplica(op, false); st.refazer.push(op); salva(); atualizaBotoes(); } });
      bt.refazer = fer('Refazer', el('span', { style: 'transform:scaleX(-1);display:grid' }, ic('back')), () => { const op = st.refazer.pop(); if (op) { aplica(op, true); st.desfazer.push(op); salva(); atualizaBotoes(); } });
      const limpar = el('button', { class: 'fer txt', type: 'button', title: 'Apagar todo o rascunho desta questão', onclick: () => {
        const ops = st.telas.filter((t) => t.tracos.length).map((t) => ({ tipo: 'apaga', tela: t, tracos: t.tracos.slice() }));
        ops.forEach((op) => { op.tela.tracos = []; desenha(op.tela); st.desfazer.push(op); });
        st.refazer = []; salva(); atualizaBotoes();
      } }, 'Limpar');
      const zoom = el('button', { class: 'fer txt', type: 'button', title: 'Voltar ao tamanho normal', onclick: () => { st.s = 1; st.tx = 0; aplicaT(); desenhaTodas(); } }, '100%');
      const folhaBtn = el('button', { class: 'fer txt', type: 'button', title: 'Ir para a folha de rascunho', onclick: () => vaiPara('folha') }, 'Folha');
      const pronto = el('button', { class: 'btn primary sm', type: 'button', onclick: fecha }, 'Pronto');
      const vp = el('div', { class: 'quadro-vp' });
      const palco = el('div', { class: 'quadro-palco' });
      vp.append(palco);
      const raiz = el('div', { class: 'quadro', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Rascunho', hidden: true },
        el('div', { class: 'quadro-barra' },
          el('div', { class: 'quadro-fer', role: 'toolbar', 'aria-label': 'Ferramentas' }, ...bt.cores, bt.marca, bt.borracha, el('span', { class: 'sep' }), bt.desfazer, bt.refazer, el('span', { class: 'sep' }), limpar, zoom, folhaBtn),
          pronto),
        el('div', { class: 'quadro-dica', text: '1 dedo escreve · 2 dedos movem e dão zoom · com Apple Pencil, 1 dedo move' }),
        vp);
      document.body.append(raiz);
      Q = { raiz, vp, palco, zoom };
      liga();
    }
    function atualizaBotoes() {
      if (lapis) lapis.setAttribute('aria-pressed', String(st.aberto));
      if (!Q) return;
      bt.cores.forEach((b, i) => b.setAttribute('aria-pressed', String(st.modo === 'caneta' && st.cor === i)));
      bt.marca.setAttribute('aria-pressed', String(st.modo === 'marca'));
      bt.borracha.setAttribute('aria-pressed', String(st.modo === 'borracha'));
      bt.desfazer.disabled = !st.desfazer.length; bt.refazer.disabled = !st.refazer.length;
    }
    function vaiPara(alvo) {
      const t = st.telas.find((x) => x.nome === alvo);
      if (!t) return;
      st.ty = -(t.host.offsetTop - 8) * st.s; aplicaT();
    }
    function abre(alvo) {
      if (!st.telas.length || st.aberto) return;
      if (!Q) monta();
      st.orig = st.telas.map((t) => [t.host, t.host.parentNode, t.host.nextSibling]);
      st.telas.forEach((t) => Q.palco.append(t.host));
      Q.raiz.hidden = false; document.documentElement.classList.add('quadro-aberto');
      st.aberto = true; st.s = 1; st.tx = 0; st.ty = 0;
      requestAnimationFrame(() => { aplicaT(); if (alvo) vaiPara(alvo); desenhaTodas(); });
      atualizaBotoes();
    }
    function fecha() {
      if (!st.aberto) return;
      ptrs.clear(); desenho = null; gesto = null;
      st.orig.forEach(([host, pai, prox]) => { if (pai) pai.insertBefore(host, prox && prox.parentNode === pai ? prox : null); });
      st.orig = []; Q.raiz.hidden = true; Q.palco.style.transform = '';
      document.documentElement.classList.remove('quadro-aberto');
      st.aberto = false; st.s = 1; desenhaTodas(); atualizaBotoes();
    }

    // ----- API usada pela tela da questão -----
    function barra() { return el('span', { hidden: true }); }
    function botaoLapis() {
      lapis = el('button', { class: 'btn icon lapis', type: 'button', title: 'Rascunho: escrever na questão', 'aria-label': 'Rascunho: escrever na questão', 'aria-pressed': 'false', onclick: () => abre() });
      const s = ic('strike'); s.innerHTML = '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'; lapis.append(s);
      return lapis;
    }
    async function anexa(qid, paper, folhaHost) {
      solta();
      st.qid = qid; st.desfazer = []; st.refazer = [];
      st.telas = [cria(paper, 'sobre'), cria(folhaHost, 'folha')];
      const salvo = await leDb(qid);
      if (st.qid !== qid) return;
      if (salvo) st.telas.forEach((t) => { t.tracos = salvo[t.nome] || []; desenha(t); });
      atualizaBotoes();
      if (quadroPend) { quadroPend = false; abre(); }
    }
    function solta() { if (st.aberto) fecha(); st.telas = []; st.qid = null; }
    return { anexa, solta, barra, botaoLapis, abre };
  })();

  // ---------- eventos ----------
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => ir(b.dataset.go)));
  $('#brand').addEventListener('click', () => ir('inicio'));
  $('#sortear-topo').addEventListener('click', () => sortear(S.view === 'inicio' ? { tipo: 'tudo' } : S.escopo, S.qid));
  $('#busca-form').addEventListener('submit', (ev) => { ev.preventDefault(); const t = $('#busca').value.trim(); if (!t) return; S.termo = t; $('#busca').blur(); ir('busca'); });
  document.addEventListener('keydown', (ev) => {
    const tag = ev.target.tagName;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.key === '/' && tag !== 'INPUT') { ev.preventDefault(); $('#busca').focus(); return; }
    if (/INPUT|SELECT|TEXTAREA/.test(tag)) return;
    const k = ev.key.length === 1 ? ev.key.toUpperCase() : ev.key;
    if (k === 'N') { ev.preventDefault(); sortear(S.view === 'inicio' ? { tipo: 'tudo' } : S.escopo, S.qid); return; }
    if (S.view !== 'questao' || !S.acao) return;
    if ('ABCDE'.includes(k) && k.length === 1) { ev.preventDefault(); S.acao.escolhe(k); }
    else if (k === 'Enter' && !ev.target.classList.contains('btn')) { ev.preventDefault(); S.acao.confirma(); }
    else if (k === 'ArrowLeft') { ev.preventDefault(); S.acao.prev(); }
    else if (k === 'ArrowRight') { ev.preventDefault(); S.acao.next(); }
  });
  window.addEventListener('hashchange', rota);

  fetch('dados/questoes.json').then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then((d) => {
    META = d.meta; QS = d.questoes;
    QS.forEach((q) => { BY.set(q.id, q); q._b = norm([q.sub, topo(q.m, q.t).nome, nomeM(q.m), q.s ? nomeM(q.s) : '', q.ano, q.txt.replace(/!\[[^\]]*\]\([^)]*\)/g, ''), q.intro].join(' ')); });
    iniciaProgresso(); rota(); preparaOffline();
  }).catch(() => {
    $('#main').replaceChildren(el('div', { class: 'card empty' }, el('h2', { text: 'Não foi possível carregar as questões' }), el('p', { class: 'muted', text: 'Recarregue a página. Se o erro continuar, peça para publicar os dados de novo.' })));
  });
})();
</script>
